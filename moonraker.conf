# pushraker-kiln's Moonraker part (Kiln OS includes it while the plugin is
# on). The notification settings are in printer_data/config/pushraker.conf,
# set from the page: http://<printer>:82/notifications/
[pushraker]
# The printer's name in the notifications until one is set on the page
name: AD5X

[pushraker_cards]
# Discord messages as status cards: status, temperatures, progress bar,
# print time, ETA, layer and file as fields, the printer's name in the
# footer (moonraker/components/pushraker_cards.py). False: pushraker's own
# plain embed.
discord_cards: True

# Updates from Fluidd or Mainsail (Software Updates). After an update,
# RESTART Klipper: Kiln then runs root/update.sh by itself when root/
# changed. A new pushraker needs a Moonraker restart (or a reboot).
[update_manager pushraker-kiln]
type: git_repo
path: /data/ad5x/plugins/pushraker
origin: https://github.com/DIEHARDave/pushraker-kiln.git
primary_branch: main
is_system_service: False
