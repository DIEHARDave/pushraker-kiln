# pushraker-kiln: the Klipper side. pushraker's own macros (the print
# hooks _PRINT_END_NTFY and _CANCEL_PRINT_NTFY, see that file) come from
# the package; the two wrappers below call them from Kiln's PRINT_END and
# CANCEL_PRINT, before those park the toolhead, so the print-end and
# cancel snapshots show the part. Kiln's files stay unchanged.

[include python/pushraker/klipper/pushraker.cfg]

[gcode_macro PRINT_END]
rename_existing: _PRINT_END_BEFORE_PUSHRAKER
description: Retract, lift, park, heaters, fans and motors off
gcode:
  _PRINT_END_NTFY
  _PRINT_END_BEFORE_PUSHRAKER {rawparams}

[gcode_macro CANCEL_PRINT]
rename_existing: _CANCEL_PRINT_BEFORE_PUSHRAKER
description: Cancel the print, park, heaters and fans off
gcode:
  _CANCEL_PRINT_NTFY
  _CANCEL_PRINT_BEFORE_PUSHRAKER {rawparams}
