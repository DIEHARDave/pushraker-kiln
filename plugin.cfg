# pushraker-kiln: the Klipper side. pushraker's own macros (the print
# hooks _PRINT_END_NTFY and _CANCEL_PRINT_NTFY, see that file) come from
# the package. extras/pushraker_hooks.py runs them at the start of Kiln's
# PRINT_END and CANCEL_PRINT, before those park the toolhead, so the
# print-end and cancel snapshots show the part. Kiln's files stay
# unchanged.

[include python/pushraker/klipper/pushraker.cfg]

[pushraker_hooks]
# COMMAND=HOOK pairs: the hook macro runs first, then the command
wrap: PRINT_END=_PRINT_END_NTFY, CANCEL_PRINT=_CANCEL_PRINT_NTFY
